[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speech2ay"
version = "0.1.0"
description = "Harmonic AY synthesis for speech and sound effects, with TS2068 audio tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "Pillow>=9"]

[project.scripts]
speech2ay = "speech2ay:cli"
audio2aydac = "audio2aydac:cli"
ayfit = "ayfit:cli"
aydemo = "aydemo:cli"

[tool.setuptools]
packages = ["tsaudio"]
py-modules = ["speech2ay", "audio2aydac", "ayfit", "aydemo"]

[tool.setuptools.package-data]
tsaudio = ["*.c"]
